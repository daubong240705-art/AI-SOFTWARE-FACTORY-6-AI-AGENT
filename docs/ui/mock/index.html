<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory · bản mock giao diện</title>
<!-- Phông (đều OFL, có đủ dấu tiếng Việt). Bản thật sẽ tự lưu cùng ứng dụng, không tải từ Internet. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#1e1e20; --surface:#262629; --raised:#2e2e32; --line:#3a3a40;
  --text:#ededef; --muted:#a0a0a8; --need:#ff6b5e; --run:#f0a53a; --ok:#4cc38a; --info:#6ea8fe;
  /* màu nhận diện dự án: chỉ dùng tông lạnh, không trùng màu trạng thái */
  --p-tx:#56c7c2; --p-cr:#9d8cff; --p-ld:#d58ac9;
  --radius:10px; --side:248px;
  --ui:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --display:"Bricolage Grotesque","Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  font-family:var(--ui); font-size:15px; line-height:1.55; color:var(--text);
  font-feature-settings:"tnum" 1,"cv11" 1;
}
*{box-sizing:border-box} html,body{height:100%} body{margin:0;background:var(--bg);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.mono{font-family:var(--mono);font-size:13px;font-variant-ligatures:none}
h1,h2,.hd,.brand{font-family:var(--display)}
.app{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:56px 1fr;height:100vh}
.app.collapsed{--side:64px}
/* sidebar */
.side{grid-row:1/3;background:#19191b;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:4px;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand i{width:28px;height:28px;border-radius:9px;background:var(--text);flex:none;display:grid;place-items:center;
  font:700 17px/1 var(--display);color:#151517;font-style:normal}
.brand i::before{content:"F"}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);background:none;border:0;text-align:left;cursor:pointer;width:100%}
.nav:hover{background:var(--surface);color:var(--text)}
.nav{position:relative}
.nav[aria-current=page]{background:var(--raised);color:var(--text)}
.nav[aria-current=page]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--text)}
.nav .badge{margin-left:auto;background:var(--need);color:#1b0b09;border-radius:99px;font-size:12px;font-weight:650;padding:0 8px;min-width:22px;text-align:center}
.nav svg{flex:none}
.group{margin:16px 10px 4px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.proj .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--need)}
.proj .code{width:28px;height:24px;border-radius:7px;font:600 11px/1 var(--mono);display:grid;place-items:center;
  color:var(--c,var(--text));background:color-mix(in srgb,var(--c,#888) 16%,transparent);border:1px solid color-mix(in srgb,var(--c,#888) 38%,transparent)}
.proj[data-p=tx]{--c:var(--p-tx)} .proj[data-p=cr]{--c:var(--p-cr)} .proj[data-p=ld]{--c:var(--p-ld)}
.av{--c:var(--muted)} .av[data-p=tx]{--c:var(--p-tx)} .av[data-p=cr]{--c:var(--p-cr)} .av[data-p=ld]{--c:var(--p-ld)}
.spacer{flex:1}
.collapsed .label,.collapsed .group,.collapsed .badge,.collapsed .dot{display:none}
/* top */
.top{display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg)}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--muted);background:transparent}
.search input{flex:1;background:none;border:0;outline:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--text);color:#151517;border-color:var(--text);font-weight:600}
.btn.primary:hover{background:#fff}
.btn.need{background:var(--need);border-color:var(--need);color:#1b0b09;font-weight:650}
.btn.ghost{background:none}
.grow{flex:1}
/* main */
.main{overflow:auto;padding:28px 32px 40px}
h1{margin:0 0 6px;font-size:38px;font-weight:700;letter-spacing:-.025em;line-height:1.1;font-variation-settings:"opsz" 72}
h1 em{font-style:normal;color:var(--p-tx)}
.sub{color:var(--muted);margin:0 0 24px;font-size:16px}
.home{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.composer{padding:18px 18px 16px;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:color-mix(in srgb,var(--info) 70%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--info) 16%,transparent)}
.composer textarea{width:100%;min-height:104px;resize:vertical;background:none;border:0;outline:0;font-size:17px;line-height:1.6}
.composer textarea::placeholder{color:#7c7c85}
.composer .row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--text)}
select{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:17px;letter-spacing:-.005em}
/* điểm nhấn duy nhất của khung "Cần xử lý": vạch màu nóng bên trái */
.needs{position:relative;overflow:hidden}
.needs::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--need)}
.hd .count{background:var(--need);color:#1b0b09;border-radius:99px;font-size:12px;padding:0 8px}
.feed{margin-top:20px}
.filters{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);border-radius:99px;padding:3px 12px;background:none;color:var(--muted);cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--raised);color:var(--text)}
.day{padding:12px 18px 4px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:12px;padding:12px 18px;border-top:1px solid var(--line)}
.av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:600 11px/1 var(--mono);color:var(--c);
  background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 34%,transparent)}
.item b{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text);margin-right:2px}
.item .meta{color:var(--muted);font-size:14px;text-align:right;white-space:nowrap}
.item p{margin:2px 0 0;color:var(--muted);font-size:14px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st.need{color:var(--need)} .st.need::before{background:var(--need)}
.st.run::before{background:var(--run);animation:pulse 1.8s ease-out infinite}
.st.ok::before{background:var(--ok)} .st.info::before{background:var(--info)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--run) 55%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
/* một lần khi mở trang: các việc cần xử lý trượt vào lần lượt */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.needs .wait{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.needs .wait:nth-of-type(2){animation-delay:.08s}.needs .wait:nth-of-type(3){animation-delay:.16s}
.wait{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.wait:hover{background:var(--raised)}
.wait b{font-weight:600}
.wait small{font-family:var(--mono);font-size:12.5px}
.row small{font-family:var(--mono);font-size:12.5px}
.wait small{color:var(--muted)}
.more{display:block;padding:12px 18px;border-top:1px solid var(--line);color:var(--muted);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer}
/* review */
.review{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 56px);margin:-28px -32px -40px}
.list{border-right:1px solid var(--line);overflow:auto}
.list h2{font-size:18px;margin:0;padding:18px 20px 10px}
.row{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 20px;cursor:pointer}
.row:hover{background:var(--surface)} .row[aria-selected=true]{background:var(--raised)}
.row .t{font-weight:600} .row small{color:var(--muted)}
.detail{display:flex;flex-direction:column;min-width:0}
.dh{padding:18px 28px 0}
.dh h2{margin:2px 0 0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2;font-variation-settings:"opsz" 48}
.list h2{font-size:22px;font-weight:700;letter-spacing:-.015em}
.tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--text)}
.body{flex:1;overflow:auto;padding:20px 28px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.files{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.diff{background:#19191b;border:1px solid var(--line);border-radius:var(--radius);overflow:auto;padding:8px 0}
/* số dòng + vạch xanh cho dòng thêm: điểm nhấn của nội dung chính */
.diff{counter-reset:ln;font-variant-ligatures:none}
.item .st{margin:0 4px}
.diff div{position:relative;padding:0 16px 0 62px;white-space:pre;font-family:var(--mono);font-size:13.5px;line-height:1.7}
.diff div::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:44px;text-align:right;color:#6b6b74;font-size:12px}
.diff .a{background:rgba(76,195,138,.10);color:#a6e6c7;box-shadow:inset 3px 0 0 var(--ok)}
.diff .h{color:var(--muted);background:#202023}
.crit{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.crit li{display:flex;gap:10px}
.crit li::before{content:"✓";color:var(--ok);font-weight:700}
.crit li.todo::before{content:"○";color:var(--muted)}
.side2{display:grid;gap:16px;position:sticky;top:0}
.side2 .card{padding:16px}
.side2 h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600}
.facts{display:grid;gap:6px;font-size:14px}
.facts div{display:flex;justify-content:space-between;gap:12px}
.facts span:first-child{color:var(--muted)}
.bar{display:flex;gap:10px;align-items:center;padding:14px 28px;border-top:1px solid var(--line);background:var(--bg)}
.hint{color:var(--muted);font-size:13px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;color:var(--muted)}
details{margin-top:6px} summary{cursor:pointer;color:var(--muted);font-size:14px}
@media (max-width:1100px){.home{grid-template-columns:1fr}.home>aside{order:-1}.body{grid-template-columns:1fr}.side2{position:static}}
@media (max-width:760px){.app{--side:64px}.label,.group,.badge,.dot{display:none!important}.review{grid-template-columns:1fr}.list{display:none}.main{padding:20px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Điều hướng chính">
    <div class="brand"><i></i><span class="label">Factory</span></div>
    <button class="nav" data-go="home" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v10H3z"/></svg><span class="label">Tổng quan</span></button>
    <button class="nav" data-go="inbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h5l1 3h6l1-3h5M5 5h14l2 8v6H3v-6z"/></svg><span class="label">Cần xử lý</span><span class="badge">3</span></button>
    <button class="nav" data-go="team"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 010 8M22 21c0-3-2-5-4-5.5"/></svg><span class="label">Đội</span></button>
    <div class="group">DỰ ÁN</div>
    <button class="nav proj" data-p="tx"><span class="code">TX</span><span class="label">textstats</span><span class="dot" title="Có việc chờ bạn"></span></button>
    <button class="nav proj" data-p="cr"><span class="code">CR</span><span class="label">Cardroom</span><span class="dot"></span></button>
    <button class="nav proj" data-p="ld"><span class="code">LD</span><span class="label">Ledger</span></button>
    <div class="spacer"></div>
    <button class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span class="label">Cài đặt</span></button>
    <button class="nav" id="collapse"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg><span class="label">Thu gọn</span></button>
  </aside>

  <header class="top">
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input placeholder="Tìm việc theo mã hoặc từ khóa" aria-label="Tìm việc"></label>
    <span class="grow"></span>
    <button class="btn primary">+ Việc mới</button>
  </header>

  <main class="main" id="main"></main>
</div>

<template id="t-home">
  <h1>Chào buổi chiều, <em>Alex</em></h1>
  <p class="sub">3 việc đang chờ bạn.</p>
  <div class="home">
    <div>
      <section class="card composer" aria-label="Giao việc hoặc hỏi Lead">
        <textarea placeholder="Hỏi hoặc mô tả việc cần làm..." aria-label="Nội dung"></textarea>
        <div class="row">
          <label class="hint" for="proj">Dự án</label>
          <select id="proj"><option>textstats</option><option>Cardroom</option><option>Ledger</option></select>
          <div class="seg" role="group" aria-label="Kiểu gửi"><button aria-pressed="false">Hỏi</button><button aria-pressed="true">Giao việc</button></div>
          <span class="grow"></span>
          <span class="hint"><kbd>Ctrl</kbd> <kbd>Enter</kbd> để gửi</span>
          <button class="btn primary">Gửi</button>
        </div>
      </section>

      <section class="card feed" aria-label="Hoạt động gần đây">
        <div class="hd">Hoạt động <span class="grow"></span><button class="btn ghost">Đánh dấu đã xem</button></div>
        <div class="filters" role="group" aria-label="Lọc"><button class="chip" aria-pressed="true">Tất cả</button><button class="chip" aria-pressed="false">Dự án</button><button class="chip" aria-pressed="false">Loại</button><button class="chip" aria-pressed="false">Ai</button></div>
        <div class="day">HÔM NAY</div>
        <div class="item"><span class="av" data-p="tx">TX</span><div><b>TSK-003</b> Viết unit test cho thư viện đã xong lần chạy<p>Agent báo 25 test đạt. Đang chờ bạn duyệt.</p></div><span class="meta">3 phút</span></div>
        <div class="item"><span class="av" data-p="tx">TX</span><div><b>TSK-002</b> Viết CLI chuyển <span class="st run">Đang chạy</span> → <span class="st need">Chờ duyệt</span></div><span class="meta">12 phút</span></div>
        <div class="item"><span class="av" data-p="cr">CR</span><div><b>CR-209</b> Sửa cuộn ngang ở thanh bên: <span class="st need">Chờ duyệt</span> → <span class="st ok">Xong</span></div><span class="meta">40 phút</span></div>
        <div class="item"><span class="av" data-p="tx">TX</span><div>Gộp <b>TSK-001</b> vào nhánh tích hợp thành công</div><span class="meta">1 giờ</span></div>
        <div class="item"><span class="av" data-p="ld">LD</span><div>Báo cáo ngày của Ledger đã tạo<p>Có 2 việc xong, 1 việc bị chặn.</p></div><span class="meta">6 giờ</span></div>
      </section>
    </div>

    <aside class="card needs" aria-label="Cần xử lý">
      <div class="hd">Cần xử lý <span class="count">3</span><span class="grow"></span></div>
      <button class="wait" data-go="inbox"><b>Duyệt: Viết unit test cho thư viện</b><span class="st need">3 phút</span><small>TSK-003 · textstats</small><span></span></button>
      <button class="wait" data-go="inbox"><b>Hỏi: định dạng của ghi chú?</b><span class="st need">1 giờ</span><small>CR-216 · Cardroom</small><span></span></button>
      <button class="wait" data-go="inbox"><b>Xung đột khi gộp nhánh</b><span class="st need">2 giờ</span><small>TSK-005 · textstats</small><span></span></button>
      <button class="more" data-go="inbox">Xem tất cả</button>
    </aside>
  </div>
</template>

<template id="t-inbox">
  <div class="review">
    <section class="list" aria-label="Danh sách cần xử lý">
      <h2>Cần xử lý</h2>
      <button class="row" aria-selected="true"><div class="t">Duyệt: Viết unit test cho thư viện</div><small>textstats · TSK-003 · 3 phút</small></button>
      <button class="row" aria-selected="false"><div class="t">Hỏi: định dạng của ghi chú?</div><small>Cardroom · CR-216 · 1 giờ</small></button>
      <button class="row" aria-selected="false"><div class="t">Xung đột khi gộp nhánh</div><small>textstats · TSK-005 · 2 giờ</small></button>
    </section>
    <section class="detail" aria-label="Chi tiết">
      <div class="dh">
        <span class="mono hint">TSK-003 · textstats</span>
        <h2>Viết unit test cho thư viện</h2>
        <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true">Kết quả</button><button class="tab" role="tab" aria-selected="false">Hoạt động</button><button class="tab" role="tab" aria-selected="false">Bối cảnh</button></div>
      </div>
      <div class="body">
        <div>
          <div class="files"><button class="chip" aria-pressed="true">test/stats.test.js <span class="hint">+99</span></button></div>
          <div class="diff" role="region" aria-label="Thay đổi" tabindex="0">
<div class="h">@@ test/stats.test.js @@</div>
<div class="a">+import { test } from "node:test";</div>
<div class="a">+import assert from "node:assert/strict";</div>
<div class="a">+import { countWords, countLines, topWords, readingTimeMinutes } from "../src/stats.js";</div>
<div class="a">+</div>
<div class="a">+test("countWords: chuỗi rỗng là 0", () => {</div>
<div class="a">+  assert.equal(countWords(""), 0);</div>
<div class="a">+});</div>
<div class="a">+</div>
<div class="a">+test("countWords: dấu nháy đơn thuộc về từ", () => {</div>
<div class="a">+  assert.equal(countWords("don't stop"), 2);</div>
<div class="a">+});</div>
<div class="a">+</div>
<div class="a">+test("topWords: đồng hạng sắp theo thứ tự chữ cái", () => {</div>
<div class="a">+  assert.deepEqual(topWords("b a b a c", 2), [{ word: "a", count: 2 }, { word: "b", count: 2 }]);</div>
<div class="a">+});</div>
<div class="a">+</div>
<div class="a">+test("readingTimeMinutes: làm tròn lên", () => {</div>
<div class="a">+  assert.equal(readingTimeMinutes("word ".repeat(201)), 2);</div>

<script>
const main=document.getElementById('main'),app=document.getElementById('app');
function go(name){
  main.replaceChildren(document.getElementById('t-'+name).content.cloneNode(true));
  document.querySelectorAll('[data-go].nav').forEach(b=>b.toggleAttribute('aria-current',b.dataset.go===name)||0);
  document.querySelectorAll('.side [data-go]').forEach(b=>{ if(b.dataset.go===name) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  main.scrollTop=0;
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return;}
  const seg=e.target.closest('.seg button'); if(seg){seg.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===seg));}
  const chip=e.target.closest('.filters .chip'); if(chip){chip.parentElement.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b===chip));}
  const row=e.target.closest('.row'); if(row){row.parentElement.querySelectorAll('.row').forEach(b=>b.setAttribute('aria-selected',b===row));}
  if(e.target.closest('#collapse')) app.classList.toggle('collapsed');
});
const hash=location.hash.slice(1); go(['home','inbox','team'].includes(hash)?hash:'home');
</script>

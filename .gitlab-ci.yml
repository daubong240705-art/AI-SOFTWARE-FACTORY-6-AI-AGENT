workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [check, build, package, deploy]
default:
  tags: [asf-ci]
  interruptible: true
  timeout: 30m
variables:
  FF_NETWORK_PER_BUILD: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  BUILD_RELEASE:
    value: "0"
    options: ["0", "1"]
    description: "Set to 1 to build both images and package a release. Normal pushes run checks only."

backend_checks:
  stage: check
  image: python:3.12-bookworm
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
    POSTGRES_DB: asf_test
    POSTGRES_USER: asf
    POSTGRES_PASSWORD: isolated-ci-only
    ASF_DATABASE_URL: postgresql+psycopg://asf:isolated-ci-only@postgres:5432/asf_test
    ASF_REDIS_URL: redis://redis:6379/0
    ASF_INTEGRATION_TEST: "1"
  cache:
    key:
      prefix: uv-py312
      files: [uv.lock]
    paths: [.cache/uv/]
  script:
    - pip install uv==0.13.7
    - uv sync --frozen
    - uv run ruff check apps/api shared agents integrations orchestrator workers infrastructure/migrations infrastructure/ci infrastructure/deploy tests
    - uv run mypy
    - uv run alembic upgrade head
    - uv run python -m orchestrator.checkpoints
    - uv run pytest -q --junitxml=reports/backend.xml
    - uv run alembic check
    - uv cache prune --ci
  artifacts:
    when: always
    expire_in: 14 days
    reports: {junit: reports/backend.xml}

frontend_checks:
  stage: check
  image: node:22-bookworm-slim
  cache:
    key:
      prefix: npm-node22
      files: [apps/dashboard/package-lock.json]
    paths: [.cache/npm/]
  script:
    - cd apps/dashboard
    - npm ci --cache "$CI_PROJECT_DIR/.cache/npm" --prefer-offline --no-audit --no-fund
    - npm run lint
    - npm run typecheck

.image:
  stage: build
  image:
    name: ghcr.io/osscontainertools/kaniko@sha256:350929376b8a69afb1d8b362086c809e4ef6799fa1bcb317c2806ae1447b3845
    entrypoint: [""]
  rules:
    - if: '$BUILD_RELEASE == "1"'
  script:
    - mkdir -p release
    - /kaniko/executor --context "$CONTEXT" --dockerfile "$DOCKERFILE" --destination "asf-${COMPONENT}:${CI_COMMIT_SHA}" --build-arg "RELEASE_SHA=${CI_COMMIT_SHA}" --no-push --tar-path "$CI_PROJECT_DIR/release/${COMPONENT}.tar" --snapshot-mode=redo --verbosity=warn
  artifacts:
    expire_in: 14 days
    paths: [release/]

image_api:
  extends: .image
  variables:
    COMPONENT: api
    CONTEXT: $CI_PROJECT_DIR
    DOCKERFILE: $CI_PROJECT_DIR/apps/api/Dockerfile

image_dashboard:
  extends: .image
  variables:
    COMPONENT: dashboard
    CONTEXT: $CI_PROJECT_DIR/apps/dashboard
    DOCKERFILE: $CI_PROJECT_DIR/apps/dashboard/Dockerfile

package_images:
  stage: package
  image: python:3.12-slim-bookworm
  needs: [image_api, image_dashboard]
  rules:
    - if: '$BUILD_RELEASE == "1"'
  script:
    - python infrastructure/ci/package.py
  artifacts:
    expire_in: 14 days
    paths: [release/]

deploy_control:
  stage: deploy
  image: alpine:3.22
  interruptible: false
  resource_group: asf-control
  environment:
    name: production
    url: https://asf.lazy.local
  variables:
    GIT_STRATEGY: none
  dependencies: []
  rules:
    - if: '$BUILD_RELEASE == "1" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
  script:
    - apk add --no-cache openssh-client
    - chmod 600 "$ASF_DEPLOY_KEY"
    - ssh -i "$ASF_DEPLOY_KEY" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ASF_DEPLOY_KNOWN_HOSTS" asf-deploy@192.168.1.14 "deploy $CI_COMMIT_SHA $CI_PIPELINE_ID $CI_JOB_ID"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^asf\//'
    - when: never
stages: [test, package, deploy]
default:
  tags: [asf-ci]
  image: python:3.12-slim-bookworm
test:
  stage: test
  script: ["PYTHONPATH=src python -B -m unittest discover -s tests"]
package_candidate:
  stage: package
  script: ["python ci/package.py"]
  artifacts:
    expire_in: 14 days
    paths: [release/]
deploy_staging:
  stage: deploy
  image: alpine:3.22
  environment:
    name: validation_staging
    url: https://asf.lazy.local/validation/healthz
  when: manual
  allow_failure: false
  interruptible: false
  resource_group: asf-validation-staging
  dependencies: []
  variables:
    GIT_STRATEGY: none
  script:
    - apk add --no-cache openssh-client
    - chmod 600 "$ASF_STAGE_KEY"
    - ssh -i "$ASF_STAGE_KEY" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ASF_STAGE_KNOWN_HOSTS" asf-stage@192.168.1.14 "stage $CI_COMMIT_SHA $CI_PIPELINE_ID $CI_JOB_ID"

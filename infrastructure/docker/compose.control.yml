name: asf-control

x-runtime: &runtime
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 160
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-api: &api
  ASF_ENVIRONMENT: production
  ASF_ALLOWED_ORIGINS: '["https://asf.lazy.local"]'
  ASF_SESSION_COOKIE_SECURE: "true"
  ASF_REDIS_URL: redis://redis:6379/0
  ASF_LIVE_MODE_ENABLED: ${ASF_LIVE_MODE_ENABLED:-false}
  ASF_RUN_TOKEN_BUDGET: "100000"
  ASF_RUN_CALL_LIMIT: "6"
  ASF_RUN_RETRY_LIMIT: "2"

services:
  postgres:
    restart: unless-stopped
    image: ${POSTGRES_IMAGE:?pin postgres digest}
    env_file: /etc/asf-control/postgres.env
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    mem_limit: 768m
    cpus: 0.6
    pids_limit: 160
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    <<: *runtime
    image: ${REDIS_IMAGE:?pin redis digest}
    user: "999:999"
    command: [redis-server, --appendonly, "yes", --maxmemory, 96mb, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    networks: [data]
    mem_limit: 128m
    cpus: 0.1
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    image: asf-api:${RELEASE_SHA:?release SHA required}
    environment: *api
    env_file: /etc/asf-control/api.env
    command: [sh, -c, 'alembic upgrade head && python -m orchestrator.checkpoints']
    networks: [data]
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 256m
    cpus: 0.3
    pids_limit: 80
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  api:
    <<: *runtime
    image: asf-api:${RELEASE_SHA:?release SHA required}
    environment: *api
    env_file: /etc/asf-control/api.env
    networks: [data, edge]
    ports: ["192.168.1.14:18101:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
    mem_limit: 384m
    cpus: 0.6
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
  workflow-worker:
    <<: *runtime
    image: asf-api:${RELEASE_SHA:?release SHA required}
    environment:
      <<: *api
      ASF_ROUTER_CA_FILE: /app/certs/caddy-root.crt
    env_file: [/etc/asf-control/api.env, /etc/asf-control/worker.env]
    networks: [data, egress]
    volumes: [/etc/asf-control/caddy-root.crt:/app/certs/caddy-root.crt:ro]
    command: [python, -m, workers.main]
    depends_on: {api: {condition: service_healthy}}
    mem_limit: 768m
    cpus: 0.8
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    stop_grace_period: 90s
  dispatcher:
    <<: *runtime
    image: asf-api:${RELEASE_SHA:?release SHA required}
    environment: *api
    env_file: /etc/asf-control/api.env
    networks: [data]
    command: [python, -m, workers.dispatcher]
    depends_on: {api: {condition: service_healthy}}
    mem_limit: 192m
    cpus: 0.1
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
  dashboard:
    <<: *runtime
    image: asf-dashboard:${RELEASE_SHA:?release SHA required}
    environment: {API_INTERNAL_URL: "http://api:8000"}
    networks: [edge]
    ports: ["192.168.1.14:18100:3000"]
    depends_on: {api: {condition: service_healthy}}
    mem_limit: 384m
    cpus: 0.4
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20

volumes:
  postgres_data:
  redis_data:
networks:
  data: {internal: true}
  edge:
  egress:
